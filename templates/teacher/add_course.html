<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Cours</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teacher.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('teacher_dashboard') }}" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Tableau de Bord</span>
                </a>
                <a href="{{ url_for('teacher_profile') }}" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Mon Profil</span>
                </a>
                <a href="{{ url_for('teacher_courses') }}" class="nav-item active">
                    <i class="fas fa-book"></i>
                    <span>Mes Cours</span>
                </a>
                <a href="{{ url_for('teacher_grades') }}" class="nav-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Notes</span>
                </a>
                <a href="{{ url_for('teacher_attendance') }}" class="nav-item">
                    <i class="fas fa-calendar-check"></i>
                    <span>Présences</span>
                </a>
                <a href="{{ url_for('logout') }}" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Ajouter un Nouveau Cours</h1>
            </header>

            <div class="card">
                <form method="POST" action="{{ url_for('add_course') }}" class="add-course-form" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="module_id">Module</label>
                        <select id="module_id" name="module_id" required>
                            <option value="">Sélectionnez un module</option>
                            {% for module in modules %}
                            <option value="{{ module.id }}">{{ module.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="title">Titre du cours</label>
                        <input type="text" id="title" name="title" required>
                    </div>

                    <div class="form-group">
                        <label for="content_type">Type de contenu</label>
                        <select id="content_type" name="content_type" required>
                            <option value="pdf">PDF</option>
                            <option value="video">Vidéo</option>
                            <option value="text">Texte</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="course_file">Fichier du cours</label>
                        <input type="file" id="course_file" name="course_file" 
                               accept=".pdf,.mp4,.txt" required>
                        <small class="file-info">Formats acceptés: PDF, MP4, TXT</small>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-plus"></i>
                            Ajouter le cours
                        </button>
                        <a href="{{ url_for('teacher_courses') }}" class="cancel-btn">
                            <i class="fas fa-times"></i>
                            Annuler
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
