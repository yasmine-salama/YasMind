<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart - Mes Cours</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('student_dashboard') }}" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Tableau de Bord</span>
                </a>
                <a href="{{ url_for('student_profile') }}" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Mon Profil</span>
                </a>
                <a href="{{ url_for('student_courses') }}" class="nav-item active">
                    <i class="fas fa-book"></i>
                    <span>Mes Cours</span>
                </a>
                <a href="{{ url_for('student_grades') }}" class="nav-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Mes Notes</span>
                </a>
                <a href="{{ url_for('student_attendance') }}" class="nav-item">
                    <i class="fas fa-calendar-check"></i>
                    <span>Présences</span>
                </a>
                <a href="{{ url_for('logout') }}" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Mes Cours</h1>
            </header>

            <div class="courses-grid">
                {% for course in courses %}
                <div class="course-card">
                    <div class="course-type">
                        <i class="fas {% if course.content_type == 'pdf' %}fa-file-pdf{% elif course.content_type == 'video' %}fa-video{% else %}fa-file-alt{% endif %}"></i>
                    </div>
                    <h3>{{ course.title }}</h3>
                    <p class="module-name">{{ course.module_name }}</p>
                    <p class="description">{{ course.description }}</p>
                    <button class="view-course-btn">
                        <i class="fas fa-eye"></i>
                        Voir le cours
                    </button>
                </div>
                {% endfor %}
            </div>
        </main>
    </div>
</body>
</html>
