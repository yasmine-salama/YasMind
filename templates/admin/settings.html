<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart - Paramètres</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="{{ url_for('admin_dashboard') }}" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Tableau de Bord</span>
                </a>
                <a href="{{ url_for('admin_users') }}" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Utilisateurs</span>
                </a>
                <a href="{{ url_for('admin_courses') }}" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span>Cours</span>
                </a>
                <a href="{{ url_for('admin_departments') }}" class="nav-item">
                    <i class="fas fa-building"></i>
                    <span>Départements</span>
                </a>
                <a href="{{ url_for('admin_settings') }}" class="nav-item active">
                    <i class="fas fa-cog"></i>
                    <span>Paramètres</span>
                </a>
                <a href="{{ url_for('logout') }}" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <h2>Paramètres du Compte</h2>
            
            <div class="settings-container">
                <form method="POST" action="{{ url_for('admin_update_settings') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="name">Nom</label>
                        <input type="text" id="name" name="name" value="{{ admin.name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ admin.email }}" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Nouveau mot de passe (laisser vide pour ne pas changer)</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Enregistrer les modifications
                    </button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
