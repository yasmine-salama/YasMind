<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart - {% block title %}{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teacher.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
                <h2>EduSmart</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('teacher_dashboard') }}" class="nav-item {{ 'active' if request.endpoint == 'teacher_dashboard' }}">
                    <i class="fas fa-home"></i><span>Tableau de Bord</span>
                </a>
                <a href="{{ url_for('teacher_classes') }}" class="nav-item {{ 'active' if request.endpoint == 'teacher_classes' }}">
                    <i class="fas fa-chalkboard"></i><span>Classes</span>
                </a>
                <a href="{{ url_for('teacher_courses') }}" class="nav-item {{ 'active' if request.endpoint == 'teacher_courses' }}">
                    <i class="fas fa-book-open"></i><span>Cours</span>
                </a>
                <a href="{{ url_for('teacher_grades') }}" class="nav-item {{ 'active' if request.endpoint == 'teacher_grades' }}">
                    <i class="fas fa-graduation-cap"></i><span>Notes</span>
                </a>
                <a href="{{ url_for('teacher_attendance') }}" class="nav-item {{ 'active' if request.endpoint == 'teacher_attendance' }}">
                    <i class="fas fa-calendar-check"></i><span>Présences</span>
                </a>
                <a href="{{ url_for('teacher_reports') }}" class="nav-item {{ 'active' if request.endpoint == 'teacher_reports' }}">
                    <i class="fas fa-chart-bar"></i><span>Rapports</span>
                </a>
                <a href="{{ url_for('logout') }}" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i><span>Déconnexion</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <h1>{% block page_title %}{% endblock %}</h1>
                    <p>{{ teacher.name }}</p>
                </div>
                <div class="header-right">
                    <div class="search-bar">
                        <input type="text" placeholder="Rechercher...">
                        <i class="fas fa-search"></i>
                    </div>
                    <div class="profile-menu">
                        <img src="{{ url_for('static', filename='images/default-avatar.png') }}" alt="Profile" class="avatar">
                    </div>
                </div>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
